name: Publish binary release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged release payload
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify release assets
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset_dir="release-assets/${TAG_NAME}"
          test -f "$asset_dir/release-notes.md"
          test -f "$asset_dir/checksums.txt"
          shopt -s nullglob
          archives=("$asset_dir"/*.deb "$asset_dir"/*.tar.gz "$asset_dir"/*.zip)
          test "${#archives[@]}" -eq 8
          (cd "$asset_dir" && sha256sum --check checksums.txt)

      - name: Create GitHub Release and upload binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          asset_dir="release-assets/${TAG_NAME}"
          files=("$asset_dir"/*.deb "$asset_dir"/*.tar.gz "$asset_dir"/*.zip "$asset_dir"/checksums.txt)
          gh release create "$TAG_NAME" "${files[@]}" \
            --verify-tag \
            --title "Madabina CLI ${TAG_NAME}" \
            --notes-file "$asset_dir/release-notes.md"
