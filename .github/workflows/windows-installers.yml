name: Build Windows installers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-installers.yml
      - packaging/windows/**
      - scripts/build-windows-installers.ps1
  release:
    types: [published]
  workflow_run:
    workflows: ["Publish binary release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-installers-${{ inputs.tag || github.event.release.tag_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm NSIS is available
        shell: pwsh
        run: |
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
            if (Test-Path -LiteralPath $candidate) {
              $nsisDirectory = Split-Path -Parent $candidate
              $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $env:PATH = "$nsisDirectory;$env:PATH"
            }
          }
          $version = (& makensis.exe /VERSION).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^v?3\.') { throw "Expected NSIS 3.x; found '$version'." }
          Write-Host "Using NSIS $version with the installer's zlib compressor."
      - name: Build per-user installers and checksums
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          $tag = $env:DISPATCH_TAG
          if (-not $tag) { $tag = $env:RELEASE_EVENT_TAG }
          if (-not $tag) { $tag = $env:WORKFLOW_RUN_TAG }
          if (-not $tag) {
            $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not list published releases.' }
            $stable = $releases | Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -match '^v\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.tagName.TrimStart('v') } -Descending
            $tag = ($stable | Select-Object -First 1).tagName
          }
          if (-not $tag) { throw 'No stable release tag was selected.' }
          ./scripts/build-windows-installers.ps1 -Tag $tag
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
      - name: Attach installers to the existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Release $env:RELEASE_TAG does not exist." }
          $assets = @(
            "build/windows-installers/$($env:RELEASE_TAG.TrimStart('v'))/madabina_$($env:RELEASE_TAG.TrimStart('v'))_windows_amd64_setup.exe",
            "build/windows-installers/$($env:RELEASE_TAG.TrimStart('v'))/madabina_$($env:RELEASE_TAG.TrimStart('v'))_windows_arm64_setup.exe",
            "build/windows-installers/$($env:RELEASE_TAG.TrimStart('v'))/checksums.txt"
          )
          gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach Windows installers to the release.' }
      - name: Upload the generated WinGet manifest set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winget-manifests-${{ steps.build.outputs.version }}
          path: build/windows-installers/${{ steps.build.outputs.version }}/winget-manifests/
          if-no-files-found: error
